<script
  data-goatcounter="https://hammer.goatcounter.com/count"
  async
  src="//gc.zgo.at/count.js"></script>

<script>
  var t = setInterval(function () {
    if (window.goatcounter && window.goatcounter.visit_count) {
      clearInterval(t);
      window.goatcounter.visit_count({
        append: "#gc-total-views",
        path: "TOTAL",
        no_branding: true
      });
    }
  }, 100);
</script>
